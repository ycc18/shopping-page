<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光市集 | 购物网页</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="拾光市集首页">
      <span class="brand-mark">拾</span>
      <span>拾光市集</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="#products">商品</a>
      <a href="#features">服务</a>
      <a href="#cart">购物车</a>
    </nav>
    <button class="cart-button" type="button" data-open-cart aria-label="打开购物车">
      <span>购物车</span>
      <strong data-cart-count>0</strong>
    </button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">NEW SEASON</p>
        <h1>把日常用品买得更漂亮，也更省心</h1>
        <p class="hero-copy">精选家居、数码、穿搭与咖啡周边，支持快速筛选、加入购物车和数量管理。</p>
        <div class="hero-actions">
          <a class="primary-link" href="#products">开始选购</a>
          <span>满 199 免运费</span>
        </div>
      </div>
    </section>

    <section class="feature-strip" id="features" aria-label="购物服务">
      <article>
        <strong>48 小时发货</strong>
        <span>现货商品快速出库</span>
      </article>
      <article>
        <strong>7 天无忧退换</strong>
        <span>未使用商品可退换</span>
      </article>
      <article>
        <strong>会员专享价</strong>
        <span>下单自动计算折扣</span>
      </article>
    </section>

    <section class="shop" id="products">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CURATED PICKS</p>
          <h2>今日精选</h2>
        </div>
        <label class="search-box">
          <span>搜索</span>
          <input type="search" data-search placeholder="杯子、键盘、背包">
        </label>
      </div>

      <div class="category-row" role="list" aria-label="商品分类" data-categories></div>
      <div class="product-grid" data-products></div>
    </section>
  </main>

  <aside class="cart-drawer" id="cart" aria-label="购物车" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <p class="eyebrow">CART</p>
          <h2>购物车</h2>
        </div>
        <button class="icon-button" type="button" data-close-cart aria-label="关闭购物车">×</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-summary">
        <div>
          <span>商品小计</span>
          <strong data-subtotal>¥0</strong>
        </div>
        <div>
          <span>运费</span>
          <strong data-shipping>¥0</strong>
        </div>
        <div class="total">
          <span>合计</span>
          <strong data-total>¥0</strong>
        </div>
        <button class="checkout-button" type="button">去结算</button>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
